<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Nền gradient xanh đậm → sáng -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006c49"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Gradient vàng ấm cho ngọn lửa -->
    <linearGradient id="fireGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Gradient xanh nhạt cho lá -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Shadow mềm -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Nền -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Vòng tròn trang trí nền mờ -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Chấm sao nhỏ góc trên -->
  <g opacity="0.3">
    <circle cx="120" cy="130" r="4" fill="white"/>
    <circle cx="392" cy="110" r="3" fill="white"/>
    <circle cx="140" cy="380" r="3.5" fill="white"/>
    <circle cx="370" cy="400" r="2.5" fill="white"/>
    <circle cx="110" cy="260" r="2" fill="white"/>
    <circle cx="400" cy="250" r="2.5" fill="white"/>
  </g>

  <!-- Đường cong trang trí nền -->
  <path d="M 60 420 Q 160 480 256 440 Q 352 400 452 420" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- ===== NỒI NẤU ĂN ===== -->
  <!-- Thân nồi (dạng bo tròn) -->
  <path d="M 152 270
    Q 152 390 256 390
    Q 360 390 360 270
    L 360 268
    L 152 268
    Z"
    fill="rgba(255,255,255,0.92)"
    filter="url(#innerGlow)"/>

  <!-- Viền miệng nồi -->
  <rect x="142" y="258" width="228" height="14" rx="7" ry="7" fill="white"/>

  <!-- Chất lỏng trong nồi -->
  <path d="M 160 280
    Q 180 310 210 295
    Q 240 280 256 300
    Q 272 320 300 295
    Q 328 272 352 290
    L 352 380
    Q 352 382 256 382
    Q 160 382 160 380
    Z"
    fill="rgba(16,185,129,0.25)"/>

  <!-- Bong bóng nhỏ trong nồi -->
  <circle cx="210" cy="330" r="6" fill="rgba(255,255,255,0.35)"/>
  <circle cx="280" cy="345" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="250" cy="360" r="3" fill="rgba(255,255,255,0.25)"/>
  <circle cx="310" cy="335" r="5" fill="rgba(255,255,255,0.3)"/>

  <!-- Rau trong nồi (miếng xanh) -->
  <ellipse cx="230" cy="295" rx="18" ry="10" fill="rgba(5,150,105,0.35)" transform="rotate(-20 230 295)"/>
  <ellipse cx="290" cy="290" rx="15" ry="8" fill="rgba(5,150,105,0.3)" transform="rotate(15 290 290)"/>

  <!-- ===== TAY CẦM ===== -->
  <!-- Tay trái -->
  <path d="M 152 278 L 120 278" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="114" cy="278" r="8" fill="rgba(255,255,255,0.6)"/>

  <!-- Tay phải -->
  <path d="M 360 278 L 392 278" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="398" cy="278" r="8" fill="rgba(255,255,255,0.6)"/>

  <!-- ===== HƠI BAY ===== -->
  <g opacity="0.25">
    <path d="M 200 240 Q 195 220 200 200 Q 205 180 195 160" fill="none" stroke="white" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M 200 240 Q 195 220 200 200 Q 205 180 195 160;M 200 240 Q 205 220 200 200 Q 195 180 205 160;M 200 240 Q 195 220 200 200 Q 205 180 195 160" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.15;0.25" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 240 235 Q 235 215 240 195 Q 245 175 235 155" fill="none" stroke="white" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M 240 235 Q 235 215 240 195 Q 245 175 235 155;M 240 235 Q 245 215 240 195 Q 235 175 245 155;M 240 235 Q 235 215 240 195 Q 245 175 235 155" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.1;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 275 240 Q 270 220 275 200 Q 280 180 270 160" fill="none" stroke="white" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d" values="M 275 240 Q 270 220 275 200 Q 280 180 270 160;M 275 240 Q 280 220 275 200 Q 270 180 280 160;M 275 240 Q 270 220 275 200 Q 280 180 270 160" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.15;0.25" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== CHI TIẾT TRANG TRÍ ===== -->

  <!-- Ngôi sao ⭐ bên phải nồi -->
  <g transform="translate(370, 175)">
    <path d="M 0 -18 L 5 -6 L 18 -6 L 8 3 L 11 16 L 0 9 L -11 16 L -8 3 L -18 -6 L -5 -6 Z" fill="rgba(252,211,77,0.5)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Chấm sáng nhỏ -->
  <circle cx="340" cy="150" r="3" fill="rgba(255,255,255,0.5)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="180" r="2.5" fill="rgba(255,255,255,0.4)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Dòng chữ nhỏ VB ở dưới (không bắt buộc, có thể bỏ) -->
</svg>
